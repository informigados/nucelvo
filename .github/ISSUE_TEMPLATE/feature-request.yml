name: Feature request
description: Suggest a new feature or an improvement to an existing workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain your goal and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: Describe the behavior you would like and mention any relevant platform or hardware.
    validations:
      required: true
