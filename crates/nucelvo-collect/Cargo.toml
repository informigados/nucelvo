[package]
name = "nucelvo-collect"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nucelvo-core.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
libloading = "0.8.9"
winreg = "0.55"
wmi = { version = "=0.18.4", default-features = false }
futures = "0.3"
futures-timer = "3"
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_EventLog", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Performance", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"

[dev-dependencies]
tempfile = "3"
