[package]
name = "nucelvo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nucelvo-core.workspace = true
nucelvo-collect.workspace = true
nucelvo-report = { path = "../nucelvo-report" }
chrono.workspace = true
rfd = "=0.18.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
slint = { version = "=1.16.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
directories = "6"
serde.workspace = true
serde_json = "1"
tempfile = "3"

[build-dependencies]
slint-build = "=1.16.1"
